<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming soon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄</text></svg>">
<style>
  :root {
    --bg1: #0b1530;
    --bg2: #1b2b55;
    --ice: #cfe6ff;
    --gold: #ffd27a;
    --red: #ff7a8a;
    --green: #7be0b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 120%, var(--bg2) 0%, var(--bg1) 60%, #060b1a 100%);
    color: var(--ice);
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .snow { position: fixed; inset: 0; pointer-events: none; }
  .flake {
    position: absolute;
    top: -2rem;
    color: #fff;
    opacity: .8;
    animation: fall linear infinite;
    user-select: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) translateX(var(--drift)) rotate(360deg); }
  }
  main { position: relative; text-align: center; padding: 2rem; }
  .icons {
    display: flex;
    gap: clamp(1rem, 4vw, 2.5rem);
    justify-content: center;
    align-items: flex-end;
    margin-bottom: 2.5rem;
  }
  .icons svg {
    width: clamp(48px, 9vw, 84px);
    height: auto;
    filter: drop-shadow(0 0 12px rgba(207, 230, 255, .25));
    animation: bob 4s ease-in-out infinite;
  }
  .icons svg:nth-child(2) { animation-delay: .5s; }
  .icons svg:nth-child(3) { animation-delay: 1s; width: clamp(64px, 12vw, 110px); }
  .icons svg:nth-child(4) { animation-delay: 1.5s; }
  .icons svg:nth-child(5) { animation-delay: 2s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4.2rem);
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1.15;
    background: linear-gradient(90deg, var(--ice), #fff, var(--gold), #fff, var(--ice));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 8s linear infinite;
  }
  @keyframes shine { to { background-position: 300% 0; } }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-origin: center; }
  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }
  .led { animation: blink 1.6s steps(2) infinite; }
  .led.b { animation-delay: .4s; }
  .led.c { animation-delay: .8s; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .flake { display: none; }
  }
</style>
</head>
<body>

<div class="snow" id="snow" aria-hidden="true"></div>

<main>
  <div class="icons" aria-hidden="true">
    <!-- snowflake -->
    <svg viewBox="0 0 64 64" fill="none" stroke="var(--ice)" stroke-width="3" stroke-linecap="round">
      <g transform="translate(32 32)">
        <g id="arm">
          <line x1="0" y1="0" x2="0" y2="-26"/>
          <polyline points="-7,-19 0,-12 7,-19"/>
          <polyline points="-5,-26 0,-21 5,-26"/>
        </g>
        <use href="#arm" transform="rotate(60)"/>
        <use href="#arm" transform="rotate(120)"/>
        <use href="#arm" transform="rotate(180)"/>
        <use href="#arm" transform="rotate(240)"/>
        <use href="#arm" transform="rotate(300)"/>
      </g>
    </svg>

    <!-- floppy disk with a bow -->
    <svg viewBox="0 0 64 64" fill="none" stroke-width="3" stroke-linejoin="round">
      <path d="M10 8h36l10 10v38H10z" stroke="var(--ice)"/>
      <rect x="20" y="8" width="20" height="14" stroke="var(--ice)"/>
      <rect x="31" y="11" width="5" height="8" fill="var(--ice)" stroke="none"/>
      <rect x="18" y="34" width="28" height="22" stroke="var(--ice)"/>
      <path d="M32 34c-6-8-14-4-8 0zM32 34c6-8 14-4 8 0z" stroke="var(--red)" fill="var(--red)" fill-opacity=".3"/>
    </svg>

    <!-- gift box -->
    <svg viewBox="0 0 64 64" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <rect x="8" y="26" width="48" height="32" rx="3" stroke="var(--gold)" fill="var(--gold)" fill-opacity=".12"/>
      <rect x="4" y="18" width="56" height="10" rx="3" stroke="var(--gold)" fill="var(--gold)" fill-opacity=".2"/>
      <line x1="32" y1="18" x2="32" y2="58" stroke="var(--red)"/>
      <path d="M32 18c-4-10-16-12-15-4 1 5 10 4 15 4z" stroke="var(--red)" fill="var(--red)" fill-opacity=".3"/>
      <path d="M32 18c4-10 16-12 15-4-1 5-10 4-15 4z" stroke="var(--red)" fill="var(--red)" fill-opacity=".3"/>
      <circle class="twinkle" cx="54" cy="8" r="2" fill="var(--gold)" stroke="none"/>
      <circle class="twinkle" cx="10" cy="10" r="1.5" fill="var(--gold)" stroke="none" style="animation-delay:.8s"/>
    </svg>

    <!-- server rack with snow cap -->
    <svg viewBox="0 0 64 64" fill="none" stroke-width="3" stroke-linejoin="round">
      <path d="M10 12c4-6 10-2 14-5 4-3 10-1 14-3 4-2 10 1 16 8z" fill="#fff" stroke="none"/>
      <rect x="12" y="12" width="40" height="46" rx="3" stroke="var(--ice)"/>
      <line x1="12" y1="27" x2="52" y2="27" stroke="var(--ice)"/>
      <line x1="12" y1="42" x2="52" y2="42" stroke="var(--ice)"/>
      <circle class="led"   cx="44" cy="20" r="2.5" fill="var(--green)" stroke="none"/>
      <circle class="led b" cx="44" cy="35" r="2.5" fill="var(--green)" stroke="none"/>
      <circle class="led c" cx="44" cy="50" r="2.5" fill="var(--gold)" stroke="none"/>
      <line x1="19" y1="20" x2="33" y2="20" stroke="var(--ice)" stroke-linecap="round"/>
      <line x1="19" y1="35" x2="33" y2="35" stroke="var(--ice)" stroke-linecap="round"/>
      <line x1="19" y1="50" x2="33" y2="50" stroke="var(--ice)" stroke-linecap="round"/>
    </svg>

    <!-- star -->
    <svg viewBox="0 0 64 64" fill="var(--gold)" fill-opacity=".25" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round">
      <path class="twinkle" d="M32 6l7.6 16.4L58 25l-13.4 12.4L48 56 32 47 16 56l3.4-18.6L6 25l18.4-2.6z"/>
    </svg>
  </div>

  <h1>Something fun is coming soon</h1>
</main>

<script>
  const snow = document.getElementById("snow");
  const glyphs = ["❄", "❅", "❆", "•"];
  for (let i = 0; i < 60; i++) {
    const f = document.createElement("span");
    f.className = "flake";
    f.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = 8 + Math.random() * 18 + "px";
    f.style.opacity = .3 + Math.random() * .6;
    f.style.animationDuration = 8 + Math.random() * 12 + "s";
    f.style.animationDelay = -Math.random() * 20 + "s";
    f.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
    snow.appendChild(f);
  }
</script>
</body>
</html>
